<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Silverpath AI Voice Solutions...</title>
    <!-- SEO Canonical -->
    <link rel="canonical" href="https://silverpath.ai/" />
    <!-- Meta Refresh Redirect -->
    <meta http-equiv="refresh" content="0; url=https://silverpath.ai/?book=true">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@500;600&display=swap');
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 3rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 50px rgba(0, 192, 216, 0.05);
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #0f172a;
        }
        p {
            font-size: 0.95rem;
            color: #475569;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 192, 216, 0.2);
            border-top-color: #00c0d8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            background-color: #00c0d8;
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 192, 216, 0.15) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
            pointer-events: none;
        }
    </style>
    <script>
        // Fallback JavaScript redirect
        setTimeout(function() {
            window.location.href = "https://silverpath.ai/?book=true";
        }, 1500);
    </script>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <div class="spinner"></div>
        <h1>Silverpath has evolved.</h1>
        <p>We are redirecting you to our new enterprise AI Voice Receptionist booking portal.</p>
        <a href="https://silverpath.ai/?book=true" class="btn">Click here if not redirected</a>
    </div>
</body>
</html>
