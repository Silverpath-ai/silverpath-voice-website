<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Evolved | Silverpath AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@500;600;700&display=swap');
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 4rem 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(0, 192, 216, 0.05);
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
        }
        .icon {
            color: #00c0d8;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #0f172a;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 1rem;
            color: #475569;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #00c0d8;
            color: #fff;
            text-decoration: none;
            padding: 0.875rem 2rem;
            border-radius: 999px;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.2s;
            box-shadow: 0 4px 14px 0 rgba(0, 192, 216, 0.39);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 192, 216, 0.23);
        }
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 192, 216, 0.15) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
            pointer-events: none;
        }
        .logo {
            height: 24px;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
    </style>
    <script>
        // Redirect to homepage after 5 seconds if they don't click the button
        setTimeout(function() {
            window.location.href = "https://silverpath.ai/";
        }, 5000);
    </script>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <h1>404: Page Evolved</h1>
        <p>It looks like the page you are looking for has been upgraded. Silverpath AI is now an enterprise AI Voice Receptionist & Automation agency.</p>
        <a href="https://silverpath.ai/" class="btn">Discover Our Voice Agents</a>
    </div>
</body>
</html>
